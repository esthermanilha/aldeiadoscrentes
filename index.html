<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aldeia dos Crentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style> :root{
    --sky-top:#4FC3F7; --sky-mid:#8FE3FF; --sky-bottom:#EAFBFF; --aero-deep:#0B6E99;
    --glass-white:rgba(255,255,255,0.55); --glass-border:rgba(255,255,255,0.85);
    --lime:#B7E877; --lime-deep:#7FB544; --sun:#FFD46B;
    --holo-pink:#FFB3E6; --holo-purple:#C9B3FF;
    --ink:#0B3B52; --ink-soft:#3E7089;
    --msn-blue:#4E8FD6; --msn-blue-dark:#2E6BAE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Nunito', sans-serif; color:var(--ink);
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, #ffffff 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
    min-height:100vh; overflow-x:hidden; position:relative;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2', sans-serif; }
  button, input, textarea, select{ font-family:inherit; }

  .bubble-field{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .bubble{
    position:absolute; bottom:-120px; border-radius:50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 22%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0) 60%),
      radial-gradient(circle at 65% 70%, rgba(201,179,255,0.25), rgba(79,195,247,0.15) 60%, transparent 75%);
    box-shadow: inset 0 0 20px rgba(255,255,255,0.6), 0 10px 30px rgba(11,110,153,0.15);
    animation: rise linear infinite; opacity:0.85;
  }
  @keyframes rise{ 0%{transform:translateY(0) translateX(0);} 50%{transform:translateY(-55vh) translateX(20px);} 100%{transform:translateY(-115vh) translateX(-10px); opacity:0;} }

  .burst-bubble{
    position:fixed; border-radius:50%; pointer-events:none; z-index:999;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), rgba(183,232,119,0.4) 40%, rgba(143,227,255,0.2) 70%, transparent 80%);
    box-shadow: inset 0 0 10px rgba(255,255,255,0.7);
    animation: burst-rise 1.1s ease-out forwards;
  }
  @keyframes burst-rise{ 0%{ transform:translateY(0) scale(0.4); opacity:0.95; } 100%{ transform:translateY(-90px) scale(1); opacity:0; } }

  .holo-border{ position:relative; border-radius:26px; }
  .holo-border::before{
    content:""; position:absolute; inset:-2px; border-radius:inherit; padding:2px;
    background:conic-gradient(from var(--angle,0deg), #FFB3E6, #C9B3FF, #8FE3FF, #B7E877, #FFD46B, #FFB3E6);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation: holo-spin 6s linear infinite; opacity:0.9; z-index:0; pointer-events:none;
  }
  @property --angle{ syntax:'<angle>'; initial-value:0deg; inherits:false; }
  @keyframes holo-spin{ from{--angle:0deg;} to{--angle:360deg;} }

  .shine{ position:relative; overflow:hidden; }
  .shine::after{
    content:""; position:absolute; top:0; left:-150%; width:60%; height:100%;
    background:linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.55) 45%, transparent 90%);
    transform:skewX(-18deg); transition:left 0.7s ease;
  }
  .shine:hover::after{ left:150%; }

  .wrap{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 20px; }

  .msn-bar{
    margin-top:18px; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.4));
    border:1px solid var(--glass-border); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 8px 24px rgba(11,110,153,0.18); flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Baloo 2'; font-weight:800; font-size:1.1rem; color:var(--aero-deep); padding:6px 10px; }
  .logo-mark{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, #ffffff 0%, #f0d9ff 20%, #C9B3FF 45%, var(--aero-deep) 100%);
    box-shadow: inset -4px -6px 10px rgba(11,110,153,0.35), 0 4px 10px rgba(11,110,153,0.3);
  }
  .tabs{ display:flex; gap:5px; flex-wrap:wrap; margin-left:auto; }
  .tab-btn{
    border:none; cursor:pointer; padding:8px 13px; border-radius:12px; font-weight:800; font-size:0.8rem; color:var(--ink-soft);
    background:rgba(255,255,255,0.4); transition:all 0.2s ease;
  }
  .tab-btn:hover{ background:rgba(255,255,255,0.75); color:var(--aero-deep); }
  .tab-btn.active{ color:#fff; background:linear-gradient(180deg, var(--msn-blue), var(--msn-blue-dark)); box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 4px 10px rgba(30,90,150,0.35); }

  .msn-window{
    border-radius:18px; overflow:hidden; background:var(--glass-white); border:1px solid var(--glass-border);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 16px 34px rgba(11,110,153,0.16); margin-bottom:24px;
  }
  .msn-titlebar{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:linear-gradient(180deg, #7FC4F5, var(--msn-blue-dark)); color:#fff;
    font-family:'Baloo 2'; font-weight:700; font-size:0.92rem; text-shadow:0 1px 2px rgba(0,40,70,0.4);
  }
  .titlebar-dots{ display:flex; gap:6px; margin-left:auto; }
  .titlebar-dots span{ width:11px; height:11px; border-radius:50%; background:rgba(255,255,255,0.5); box-shadow: inset 0 1px 1px rgba(255,255,255,0.7); }
  .titlebar-dots span:nth-child(1){ background:#FFB3B3; }
  .titlebar-dots span:nth-child(2){ background:#FFE29A; }
  .titlebar-dots span:nth-child(3){ background:#B7E877; }
  .msn-body{ padding:20px; }
  .status-dot{ width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #d4ffb0, var(--lime-deep)); box-shadow:0 0 8px var(--lime); display:inline-block; }

  .btn-glossy{
    position:relative; display:inline-flex; align-items:center; gap:8px; padding:11px 22px; border-radius:999px; border:none; cursor:pointer;
    font-family:'Baloo 2'; font-weight:700; font-size:0.9rem; color:#fff;
    background:linear-gradient(180deg, #8FE99A 0%, var(--lime) 45%, var(--lime-deep) 100%);
    box-shadow: inset 0 2px 1px rgba(255,255,255,0.8), inset 0 -6px 10px rgba(65,120,30,0.35), 0 8px 18px rgba(60,130,30,0.35), 0 2px 0 var(--lime-deep);
    text-shadow:0 1px 2px rgba(0,60,0,0.25); transition: transform 0.15s ease; overflow:hidden;
  }
  .btn-glossy::after{ content:""; position:absolute; top:6%; left:8%; width:60%; height:38%; border-radius:50%; background:linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0)); filter:blur(1px); pointer-events:none; }
  .btn-glossy:hover{ transform:translateY(-3px); }
  .btn-glossy:active{ transform:translateY(1px); }
  .btn-glossy.blue{ background:linear-gradient(180deg, #7FDDFF 0%, var(--sky-top) 45%, var(--aero-deep) 100%); box-shadow: inset 0 2px 1px rgba(255,255,255,0.8), inset 0 -6px 10px rgba(6,70,100,0.4), 0 8px 18px rgba(6,70,100,0.3), 0 2px 0 var(--aero-deep); text-shadow:0 1px 2px rgba(0,30,50,0.35); }
  .btn-glossy.purple{ background:linear-gradient(180deg, #E0CFFF 0%, var(--holo-purple) 45%, #8F6FE0 100%); box-shadow: inset 0 2px 1px rgba(255,255,255,0.8), inset 0 -6px 10px rgba(90,50,150,0.35), 0 8px 18px rgba(90,50,150,0.3), 0 2px 0 #8F6FE0; text-shadow:0 1px 2px rgba(50,10,90,0.3); }
  .btn-glossy.pink{ background:linear-gradient(180deg, #FFE0F3 0%, var(--holo-pink) 45%, #E066B8 100%); box-shadow: inset 0 2px 1px rgba(255,255,255,0.8), inset 0 -6px 10px rgba(150,40,110,0.35), 0 8px 18px rgba(150,40,110,0.3), 0 2px 0 #E066B8; text-shadow:0 1px 2px rgba(90,10,60,0.3); }
  .btn-glossy.small{ padding:7px 14px; font-size:0.78rem; }
  .btn-glossy:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }
  .btn-ghost{
    border:1px solid var(--glass-border); background:rgba(255,255,255,0.4); cursor:pointer; border-radius:999px;
    padding:7px 14px; font-weight:800; font-size:0.78rem; color:var(--ink-soft);
  }
  .btn-ghost.liked{ background:linear-gradient(180deg, #FFE0F3, var(--holo-pink)); color:#7a2c58; }

  .hero{ display:grid; grid-template-columns:1.1fr 0.9fr; align-items:center; gap:32px; padding:40px 0 26px; }
  .eyebrow{ display:inline-block; padding:6px 16px; border-radius:999px; background:var(--glass-white); border:1px solid var(--glass-border); backdrop-filter:blur(10px); font-weight:800; font-size:0.75rem; color:var(--aero-deep); margin-bottom:14px; }
  .hero h1{ font-size:2.6rem; line-height:1.08; font-weight:800; color:var(--aero-deep); text-shadow:0 2px 0 rgba(255,255,255,0.6); margin-bottom:14px; }
  .hero h1 span{ background:linear-gradient(90deg, #FFB3E6, #C9B3FF, #8FE3FF, #B7E877); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; background-size:300% auto; animation: holo-text 5s linear infinite; }
  @keyframes holo-text{ to{ background-position:300% center; } }
  .hero p{ font-size:1.02rem; color:var(--ink-soft); max-width:480px; margin-bottom:22px; font-weight:600; }
  .hero-actions{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .online-pill{ display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; background:var(--glass-white); border:1px solid var(--glass-border); backdrop-filter:blur(10px); font-weight:800; font-size:0.82rem; color:var(--ink); }
  .orb-stage{ position:relative; height:280px; display:flex; align-items:center; justify-content:center; }
  .orb{ width:200px; height:200px; border-radius:50%; background: radial-gradient(circle at 30% 25%, #ffffff 0%, #f5e3ff 15%, #C9B3FF 35%, var(--sky-top) 65%, var(--aero-deep) 100%); box-shadow: inset -20px -30px 50px rgba(6,70,100,0.4), inset 10px 10px 30px rgba(255,255,255,0.6), 0 30px 60px rgba(6,70,100,0.3); position:relative; animation: float 6s ease-in-out infinite; }
  .orb::before{ content:""; position:absolute; top:14%; left:20%; width:35%; height:22%; border-radius:50%; background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0)); filter:blur(2px); }
  .orb::after{ content:""; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.6rem; color:rgba(255,255,255,0.75); text-shadow:0 2px 8px rgba(6,70,100,0.4); }
  .orb-ring{ position:absolute; width:250px; height:250px; border-radius:50%; border:2px solid rgba(255,255,255,0.6); animation: spin 18s linear infinite; }
  .orb-ring::before, .orb-ring::after{ content:""; position:absolute; width:14px; height:14px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #fff, var(--holo-purple)); box-shadow:0 0 10px rgba(201,179,255,0.8); }
  .orb-ring::before{ top:-7px; left:50%; margin-left:-7px; }
  .orb-ring::after{ bottom:16px; right:0; }
  @keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-16px); } }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

  .section-head{ margin-bottom:20px; }
  .section-head h2{ font-size:1.5rem; color:var(--aero-deep); margin-bottom:5px; font-weight:800; }
  .section-head p{ color:var(--ink-soft); font-weight:600; font-size:0.9rem; }

  .grid-3{ display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
  .grid-2{ display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; }
  .glass-card{
    padding:20px 18px; border-radius:22px; background:rgba(255,255,255,0.55); border:1px solid var(--glass-border);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 12px 26px rgba(11,110,153,0.12);
    transition:transform 0.25s ease; position:relative; overflow:hidden;
  }
  .glass-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:45%; background:linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0)); pointer-events:none; }
  .glass-card:hover{ transform:translateY(-6px); }
  .event-thumb{ height:110px; border-radius:14px; margin-bottom:12px; display:flex; align-items:center; justify-content:center; font-size:2.2rem; background:linear-gradient(135deg, #FFD6F0, #D6C9FF, #C7EFFF); }
  .glass-card h3{ font-size:1rem; color:var(--aero-deep); margin-bottom:5px; font-weight:700; }
  .glass-card .meta{ font-size:0.75rem; color:var(--ink-soft); font-weight:800; margin-bottom:7px; }
  .glass-card p{ color:var(--ink-soft); font-size:0.87rem; font-weight:600; line-height:1.5; }

  .video-card{ display:flex; gap:14px; padding:14px; border-radius:18px; background:rgba(255,255,255,0.5); border:1px solid var(--glass-border); backdrop-filter:blur(10px); align-items:center; }
  .video-thumb{ width:80px; height:58px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.4rem; color:#fff; background:linear-gradient(135deg, #FF6B6B, #C9B3FF); }
  .video-card .name{ font-weight:800; color:var(--aero-deep); font-size:0.92rem; }
  .video-card .desc{ color:var(--ink-soft); font-size:0.8rem; font-weight:600; }
  .video-card a.link{ font-size:0.75rem; font-weight:800; color:var(--msn-blue-dark); text-decoration:none; }

  /* ---------- Feed (novidades / fórum) ---------- */
  .composer{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .composer-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .composer select{ padding:8px 10px; border-radius:10px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.7); font-weight:700; font-size:0.82rem; }
  .composer textarea{ width:100%; padding:10px 14px; border-radius:14px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.7); font-weight:600; font-size:0.9rem; min-height:56px; resize:vertical; }
  .poll-builder{ display:none; flex-direction:column; gap:6px; margin-top:6px; }
  .poll-builder input{ padding:8px 12px; border-radius:10px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.7); font-weight:600; font-size:0.82rem; }

  .post{ padding:16px; border-radius:18px; background:rgba(255,255,255,0.5); border:1px solid var(--glass-border); backdrop-filter:blur(10px); margin-bottom:14px; }
  .post-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .post-head .pauthor{ font-weight:800; color:var(--aero-deep); font-size:0.9rem; cursor:pointer; }
  .post-head .ptag{ font-size:0.68rem; font-weight:800; color:#fff; padding:2px 9px; border-radius:999px; background:var(--msn-blue); }
  .post-head .ptag.desabafo{ background:#C97FE0; }
  .post-head .ptag.enquete{ background:var(--lime-deep); }
  .post-head .ptime{ margin-left:auto; font-size:0.72rem; color:var(--ink-soft); font-weight:700; }
  .post-text{ font-weight:600; color:var(--ink); font-size:0.92rem; line-height:1.5; margin-bottom:10px; }
  .post-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .post-comments{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--glass-border); }
  .comment{ font-size:0.83rem; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .comment b{ color:var(--aero-deep); }
  .comment-box{ display:flex; gap:6px; margin-top:8px; }
  .comment-box input{ flex:1; padding:8px 12px; border-radius:999px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.7); font-weight:600; font-size:0.8rem; }

  /* ---------- Enquetes dentro do post ---------- */
  .poll-opt{ margin-bottom:8px; }
  .poll-opt button{
    width:100%; text-align:left; border:none; cursor:pointer; padding:9px 12px; border-radius:12px;
    background:rgba(255,255,255,0.55); border:1px solid var(--glass-border); font-weight:700; color:var(--ink); font-size:0.85rem;
    display:flex; justify-content:space-between; align-items:center; gap:10px; position:relative; overflow:hidden;
  }
  .poll-opt .bar{ position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, rgba(183,232,119,0.55), rgba(143,227,255,0.4)); z-index:0; transition:width 0.4s ease; }
  .poll-opt .label{ position:relative; z-index:1; }
  .poll-opt .count{ position:relative; z-index:1; font-size:0.72rem; color:var(--ink-soft); }
  .poll-opt button.voted{ outline:2px solid var(--lime-deep); }

  /* ---------- Comunidade / perfis ---------- */
  .login-box{ max-width:420px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-weight:800; font-size:0.8rem; color:var(--aero-deep); margin-bottom:6px; }
  .field input, .field textarea, .field select{ width:100%; padding:10px 14px; border-radius:12px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.7); font-weight:700; color:var(--ink); font-size:0.88rem; }
  .field textarea{ resize:vertical; min-height:70px; font-weight:600; }
  .field small{ display:block; margin-top:4px; font-weight:600; color:var(--ink-soft); font-size:0.72rem; }

  .profile-header{ display:flex; gap:16px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .avatar-big{ width:74px; height:74px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:2.1rem; overflow:hidden;
    background:radial-gradient(circle at 30% 25%, #fff, #D6C9FF 40%, var(--aero-deep) 100%); box-shadow: inset -6px -8px 12px rgba(6,70,100,0.3), 0 8px 18px rgba(6,70,100,0.25); }
  .avatar-big img{ width:100%; height:100%; object-fit:cover; }
  .profile-name{ font-family:'Baloo 2'; font-weight:800; font-size:1.25rem; color:var(--aero-deep); }
  .profile-tag{ color:var(--ink-soft); font-weight:700; font-size:0.83rem; }
  .profile-facts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
  .fact-pill{ padding:5px 11px; border-radius:999px; background:rgba(255,255,255,0.6); border:1px solid var(--glass-border); font-weight:700; font-size:0.75rem; color:var(--ink); }
  .badge-pill{ padding:5px 11px; border-radius:999px; background:linear-gradient(180deg, #FFE9B3, var(--sun)); font-weight:800; font-size:0.75rem; color:#6b4900; }

  .badge-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:6px; }
  .badge-btn{ border:none; cursor:pointer; padding:9px 6px; border-radius:12px; background:rgba(255,255,255,0.5); border:1px solid var(--glass-border); font-weight:700; font-size:0.72rem; text-align:center; }
  .badge-btn small{ display:block; font-weight:700; color:var(--ink-soft); font-size:0.68rem; }
  .badge-btn.voted{ background:linear-gradient(180deg, #E0F7D0, var(--lime)); }

  .member-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:8px; }
  .member-chip{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:rgba(255,255,255,0.5); border:1px solid var(--glass-border); cursor:pointer; transition:background 0.2s ease; }
  .member-chip:hover{ background:rgba(255,255,255,0.85); }
  .avatar-sm{ width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1rem; overflow:hidden; background:radial-gradient(circle at 30% 25%, #fff, #C9E7FF 40%, var(--aero-deep) 100%); }
  .avatar-sm img{ width:100%; height:100%; object-fit:cover; }
  .member-chip .mname{ font-weight:800; font-size:0.83rem; color:var(--ink); }
  .member-chip .mstatus{ font-size:0.7rem; color:var(--ink-soft); font-weight:700; }

  .recado{ padding:11px 13px; border-radius:14px; background:rgba(255,255,255,0.5); border:1px solid var(--glass-border); margin-bottom:9px; }
  .recado .from{ font-weight:800; color:var(--aero-deep); font-size:0.8rem; }
  .recado .text{ font-weight:600; color:var(--ink); font-size:0.86rem; margin-top:2px; }

  .history-item{ font-size:0.82rem; font-weight:600; color:var(--ink-soft); margin-bottom:7px; padding-left:10px; border-left:3px solid var(--holo-purple); }
  .history-item b{ color:var(--aero-deep); }

  .divider{ height:1px; background:linear-gradient(90deg, transparent, var(--glass-border), transparent); margin:18px 0; }
  .small-note{ font-size:0.76rem; color:var(--ink-soft); font-weight:700; }

  /* ---------- Bíblia ---------- */
  .bible-toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }

    b.style.width=size+'px'; b.style.height=size+'px';

function timeAgo(ts){
  const diff = Date.now()-ts;
  const h = Math.floor(diff/(1000*60*60));
  if(h<1) return 'agora há pouco';
  if(h<24) return h+'h atrás';
  const d = Math.floor(h/24);
  return d+'d atrás';
}

function renderPostHTML(p){
  const tagClass = p.type==='desabafo' ? 'desabafo' : (p.type==='enquete' ? 'enquete' : '');
  const tagLabel = p.type==='desabafo' ? 'desabafo' : (p.type==='enquete' ? 'enquete' : 'novidade');
  const liked = currentUser && p.likes.includes(currentUser);
  let pollHtml = '';
  if(p.type==='enquete' && p.pollOptions){
    const total = Object.values(p.pollVotes||{}).reduce((a,b)=>a+b,0);
    pollHtml = '<div class="poll-block" data-post="'+p.id+'">' + p.pollOptions.map(([k,label])=>{
      const count = (p.pollVotes||{})[k]||0;
      const pct = total>0 ? Math.round((count/total)*100) : 0;
      return `<div class="poll-opt"><button data-post="${p.id}" data-opt="${k}" class="poll-vote-btn"><span class="bar" style="width:${pct}%"></span><span class="label">${label}</span><span class="count">${count} · ${pct}%</span></button></div>`;
    }).join('') + '</div>';
  }
  return `
    <div class="post" data-id="${p.id}"> <div class="post-head"> <span class="pauthor" data-user="${p.author}">${p.author}</span> <span class="ptag ${tagClass}">${tagLabel}</span> <span class="ptime">${timeAgo(p.ts)}</span> </div> <div class="post-text">${p.text}</div> ${pollHtml}

}

function attachPostHandlers(container){
  container.querySelectorAll('.pauthor').forEach(el=>{
    el.addEventListener('click', ()=>{ viewingProfile = el.dataset.user; currentTab='comunidade'; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab==='comunidade')); render(); });
  });
  container.querySelectorAll('.like-btn').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!requireLogin()) return;
      const posts = await getPosts();
      const p = posts.find(x=>x.id===el.dataset.id);
      const idx = p.likes.indexOf(currentUser);
      if(idx>=0) p.likes.splice(idx,1); else p.likes.push(currentUser);
      await savePosts(posts);
      render();
    });
  });
  container.querySelectorAll('.comment-toggle').forEach(el=>{
    el.addEventListener('click', ()=>{
      const box = document.getElementById('comments-'+el.dataset.id);
      box.style.display = box.style.display==='none' ? 'block' : 'none';
    });
  });
  container.querySelectorAll('.send-comment').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!requireLogin()) return;
      const id = el.dataset.id;
      const input = document.getElementById('newcomment-'+id);
      const text = input.value.trim();
      if(!text) return;
      const posts = await getPosts();
      const p = posts.find(x=>x.id===id);
      p.comments.push({author:currentUser, text});
      await savePosts(posts);
      render();
    });
  });
  container.querySelectorAll('.poll-vote-btn').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!requireLogin()) return;
      const id = el.dataset.post, opt = el.dataset.opt;
      const myPollVotes = await getPersonalJSON('mypollvotes', {});
      if(myPollVotes[id]){ alert('Você já votou nessa enquete!'); return; }
      const posts = await getPosts();
      const p = posts.find(x=>x.id===id);
      p.pollVotes = p.pollVotes || {};
      p.pollVotes[opt] = (p.pollVotes[opt]||0)+1;
      await savePosts(posts);
      myPollVotes[id] = opt;
      await setPersonalJSON('mypollvotes', myPollVotes);
      render();
    });
  });
}

/* ============ Bíblia completa (ALM1911.json) ============ */
let BIBLE_DATA = null;
let bibleBookIndex = 0;
let bibleChapterIndex = 0;
let bibleTestament = 'all';

const BIBLE_BOOK_NAMES = [
'Gênesis','Êxodo','Levítico','Números','Deuteronômio','Josué','Juízes','Rute','1 Samuel','2 Samuel',
'1 Reis','2 Reis','1 Crônicas','2 Crônicas','Esdras','Neemias','Ester','Jó','Salmos','Provérbios',
'Eclesiastes','Cânticos','Isaías','Jeremias','Lamentações','Ezequiel','Daniel','Oseias','Joel','Amós',
'Obadias','Jonas','Miqueias','Naum','Habacuque','Sofonias','Ageu','Zacarias','Malaquias',
'Mateus','Marcos','Lucas','João','Atos','Romanos','1 Coríntios','2 Coríntios','Gálatas','Efésios',
'Filipenses','Colossenses','1 Tessalonicenses','2 Tessalonicenses','1 Timóteo','2 Timóteo','Tito',
'Filemom','Hebreus','Tiago','1 Pedro','2 Pedro','1 João','2 João','3 João','Judas','Apocalipse'
];

function normalizeBible(raw){
  let books = Array.isArray(raw) ? raw : (raw.books || raw.data || raw.bible || []);
  if(!Array.isArray(books)) throw new Error('Formato do ALM1911.json não reconhecido.');

  return books.map((book, bi)=>{
    let chapters = book.chapters || book.capitulos || book.chapter || [];
    if(!Array.isArray(chapters) && chapters && typeof chapters==='object') chapters = Object.values(chapters);

    chapters = chapters.map(ch=>{
      let verses = Array.isArray(ch) ? ch : (ch.verses || ch.versiculos || ch.verse || []);
      if(!Array.isArray(verses) && verses && typeof verses==='object') verses = Object.values(verses);
      return (verses || []).map(v=>{
        if(typeof v==='string') return v;
        return v.text || v.texto || v.content || v.verse || '';
      });
    });

    return {
      name: book.name || book.nome || book.book || book.title || BIBLE_BOOK_NAMES[bi] || ('Livro '+(bi+1)),
      abbrev: book.abbrev || book.abbreviation || book.abreviacao || '',
      chapters
    };
  }).filter(b=>b.chapters.length);
}

async function loadBibleData(){
  if(BIBLE_DATA) return BIBLE_DATA;
  const res = await fetch('./ALM1911.json', {cache:'force-cache'});
  if(!res.ok) throw new Error('Não consegui carregar ALM1911.json ('+res.status+').');
  BIBLE_DATA = normalizeBible(await res.json());
  return BIBLE_DATA;
}

function bibleUserKey(){
  return 'bible-reader:' + (currentUser || 'visitante');
}

async function getBiblePersonal(){
  return await getPersonalJSON(bibleUserKey(), {highlights:{}, notes:{}, last:null});
}

async function saveBiblePersonal(data){
  return await setPersonalJSON(bibleUserKey(), data);
}

function verseKey(bookIndex, chapterIndex, verseIndex){
  return bookIndex+':'+chapterIndex+':'+verseIndex;
}

function escapeBibleText(s){
  return String(s ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function drawBibleReader(){
  const root = document.getElementById('bibleReader');
  if(!root) return;
  root.innerHTML='<div class="bible-loading">Carregando a Bíblia Almeida 1911...</div>';

  try{
    const books = await loadBibleData();
    const personal = await getBiblePersonal();

    if(personal.last && Number.isInteger(personal.last.book)){
      bibleBookIndex = Math.min(personal.last.book, books.length-1);
      bibleChapterIndex = Math.min(personal.last.chapter || 0, books[bibleBookIndex].chapters.length-1);
    }

    const visibleBooks = books.map((b,i)=>({b,i})).filter(({i})=>{
      if(bibleTestament==='old') return i < 39;
      if(bibleTestament==='new') return i >= 39;
      return true;
    });

    const book = books[bibleBookIndex] || books[0];
    const chapter = book.chapters[bibleChapterIndex] || book.chapters[0] || [];

    root.innerHTML = `
      <div class="bible-reader-head">
        <h3>Leia a Bíblia</h3>
        <span class="small-note">Almeida 1911</span>
      </div>
      <div class="bible-testament-tabs">
        <button data-testament="all" class="${bibleTestament==='all'?'active':''}">Todos</button>
        <button data-testament="old" class="${bibleTestament==='old'?'active':''}">Antigo Testamento</button>
        <button data-testament="new" class="${bibleTestament==='new'?'active':''}">Novo Testamento</button>
      </div>
      <div class="bible-books">
        ${visibleBooks.map(({b,i})=>`<button class="bible-book-btn ${i===bibleBookIndex?'active':''}" data-book="${i}">${escapeBibleText(b.name)}</button>`).join('')}
      </div>
      <div class="divider"></div>
      <div class="bible-reading-title">${escapeBibleText(book.name)}</div>
      <div class="small-note">Escolha o capítulo</div>
      <div class="bible-chapters">
        ${book.chapters.map((_,i)=>`<button class="bible-chapter-btn ${i===bibleChapterIndex?'active':''}" data-chapter="${i}">${i+1}</button>`).join('')}
      </div>
      <div class="bible-reading-title">${escapeBibleText(book.name)} ${bibleChapterIndex+1}</div>
      <div id="bibleVerses">
        ${chapter.map((text,vi)=>{
          const key=verseKey(bibleBookIndex,bibleChapterIndex,vi);
          const mark=personal.highlights[key] || '';
          const note=personal.notes[key] || '';
          return `<div class="bible-verse-row ${mark?'mark-'+mark:''}" data-verse="${vi}">
            <span class="bible-verse-number">${vi+1}</span>${escapeBibleText(text)}
            ${note?`<span class="bible-note-saved">Anotação: ${escapeBibleText(note)}</span>`:''}
            <div class="bible-verse-tools">
              <button class="mark-dot yellow" data-color="yellow" title="Amarelo"></button>
              <button class="mark-dot green" data-color="green" title="Verde"></button>
              <button class="mark-dot pink" data-color="pink" title="Rosa"></button>
              <button class="mark-dot blue" data-color="blue" title="Azul"></button>
              <button class="btn-ghost bible-clear-mark">Limpar</button>
              <input class="bible-note-input" value="${escapeBibleText(note)}" placeholder="Escreva uma anotação...">
              <button class="btn-ghost bible-save-note">Salvar nota</button>
            </div>
          </div>`;
        }).join('')}
      </div>`;

    root.querySelectorAll('[data-testament]').forEach(btn=>btn.onclick=()=>{
      bibleTestament=btn.dataset.testament;
      if(bibleTestament==='old' && bibleBookIndex>=39){ bibleBookIndex=0; bibleChapterIndex=0; }
      if(bibleTestament==='new' && bibleBookIndex<39){ bibleBookIndex=39; bibleChapterIndex=0; }
      drawBibleReader();
    });

    root.querySelectorAll('[data-book]').forEach(btn=>btn.onclick=async()=>{
      bibleBookIndex=Number(btn.dataset.book); bibleChapterIndex=0;
      const p=await getBiblePersonal(); p.last={book:bibleBookIndex,chapter:0}; await saveBiblePersonal(p);
      drawBibleReader();
    });

    root.querySelectorAll('[data-chapter]').forEach(btn=>btn.onclick=async()=>{
      bibleChapterIndex=Number(btn.dataset.chapter);
      const p=await getBiblePersonal(); p.last={book:bibleBookIndex,chapter:bibleChapterIndex}; await saveBiblePersonal(p);
      drawBibleReader();
    });

    root.querySelectorAll('.bible-verse-row').forEach(row=>{
      row.addEventListener('click',e=>{
        if(e.target.closest('button,input')) return;
        root.querySelectorAll('.bible-verse-row.selected').forEach(r=>{if(r!==row)r.classList.remove('selected')});
        row.classList.toggle('selected');
      });

      row.querySelectorAll('.mark-dot').forEach(dot=>dot.onclick=async(e)=>{
        e.stopPropagation();
        const vi=Number(row.dataset.verse), key=verseKey(bibleBookIndex,bibleChapterIndex,vi);
        const p=await getBiblePersonal(); p.highlights[key]=dot.dataset.color; await saveBiblePersonal(p);
        ['yellow','green','pink','blue'].forEach(c=>row.classList.remove('mark-'+c));
        row.classList.add('mark-'+dot.dataset.color);
      });

      row.querySelector('.bible-clear-mark').onclick=async(e)=>{
        e.stopPropagation();
        const vi=Number(row.dataset.verse), key=verseKey(bibleBookIndex,bibleChapterIndex,vi);
        const p=await getBiblePersonal(); delete p.highlights[key]; await saveBiblePersonal(p);
        ['yellow','green','pink','blue'].forEach(c=>row.classList.remove('mark-'+c));
      };

      row.querySelector('.bible-save-note').onclick=async(e)=>{
        e.stopPropagation();
        const vi=Number(row.dataset.verse), key=verseKey(bibleBookIndex,bibleChapterIndex,vi);
        const input=row.querySelector('.bible-note-input');
        const p=await getBiblePersonal();
        if(input.value.trim()) p.notes[key]=input.value.trim(); else delete p.notes[key];
        await saveBiblePersonal(p);
        drawBibleReader();
      };
    });

  }catch(err){
    console.error(err);
    root.innerHTML=`<div class="bible-error">Não consegui abrir o ALM1911.json. No GitHub Pages ele precisa ficar na mesma pasta do index.html.</div>`;
  }
}

      const name = document.getElementById('loginName').value.trim();
      if(!name){ alert('Digita um nome primeiro :)'); return; }
      const safeName = name.toLowerCase().replace(/[^a-z0-9_]/g,'');
      if(!safeName){ alert('Usa letras, números ou _'); return; }
      await setPersonal('currentUser', safeName);
      const existing = await getShared('member:'+safeName);
      if(!existing){
        await setShared('member:'+safeName, { username:safeName, avatar:AVATARS[Math.floor(Math.random()*AVATARS.length)], avatarUrl:'', bio:'Ainda não escreveu nada sobre si.', verse:'', anime:'', friends:[] });
        const idx = (await getShared('member-index')) || [];
        if(!idx.includes(safeName)){ idx.push(safeName); await setShared('member-index', idx); }
      }
      currentUser = safeName; viewingProfile = safeName;
      renderComunidade();
    });
    return;
  }

  if(!viewingProfile) viewingProfile = currentUser;
  const profile = await getShared('member:'+viewingProfile);
  const memberIndex = (await getShared('member-index')) || [];
  const guestbook = (await getShared('guestbook:'+viewingProfile)) || [];
  const badgeVotes = (await getShared('badges:'+viewingProfile)) || {};
  const isOwn = viewingProfile===currentUser;
  const myProfile = isOwn ? profile : await getShared('member:'+currentUser);
  const isFriend = myProfile && myProfile.friends && myProfile.friends.includes(viewingProfile);
  const myBadgeVotes = await getPersonalJSON('mybadgevotes', {});
  const myVoteOnThisProfile = myBadgeVotes[viewingProfile];

  const topBadges = Object.entries(badgeVotes).sort((a,b)=>b[1]-a[1]).slice(0,4);

  const avatarHtml = profile.avatarUrl ? `<img src="${profile.avatarUrl}" alt="">` : profile.avatar;

  let membersHtml = '';
  for(const uname of memberIndex){
    if(uname===viewingProfile) continue;
    const m = await getShared('member:'+uname);
    if(!m) continue;
    const mAvatar = m.avatarUrl ? `<img src="${m.avatarUrl}" alt="">` : m.avatar;
    membersHtml += `<div class="member-chip" data-user="${uname}"><div class="avatar-sm">${mAvatar}</div><div><div class="mname">${uname}</div><div class="mstatus">${m.anime? m.anime : 'membro da Aldeia'}</div></div></div>`;
  }

  const allPosts = await getPosts();
  const historyItems = allPosts.filter(p=>p.author===viewingProfile || p.likes.includes(viewingProfile) || p.comments.some(c=>c.author===viewingProfile));
  let historyHtml = '';
  historyItems.slice(0,12).forEach(p=>{
    if(p.author===viewingProfile) historyHtml += `<div class="history-item">Publicou: <b>"${p.text.slice(0,60)}${p.text.length>60?'...':''}"</b></div>`;
    else if(p.likes.includes(viewingProfile)) historyHtml += `<div class="history-item">Curtiu o post de <b>${p.author}</b>: "${p.text.slice(0,50)}${p.text.length>50?'...':''}"</div>`;
    const myComments = p.comments.filter(c=>c.author===viewingProfile);
    myComments.forEach(c=>{ historyHtml += `<div class="history-item">Comentou em post de <b>${p.author}</b>: "${c.text.slice(0,50)}"</div>`; });
  });

  viewEl.innerHTML = `
    <div class="msn-window holo-border"> <div class="msn-titlebar">Homepage de ${viewingProfile} <div class="titlebar-dots"><span></span><span></span><span></span></div></div> <div class="msn-body"> <div class="profile-header"> <div class="avatar-big">${avatarHtml}</div> <div> <div class="profile-name">${viewingProfile} ${isOwn?'(você)':''}</div> <div class="profile-tag"><span class="status-dot"></span> online na Aldeia</div> <div class="profile-facts"> ${profile.verse?`<span class="fact-pill">${profile.verse}</span>`:''}
              ${profile.anime?`<span class="fact-pill">${profile.anime}</span>`:''}
              <span class="fact-pill">${(profile.friends||[]).length} amigos</span> ${topBadges.map(([k,v])=>{ const b=BADGES.find(x=>x[0]===k); return b?`<span class="badge-pill">${b[1]} (${v})</span>`:''; }).join('')}
            </div> </div> ${!isOwn ? `<button class="btn-glossy small ${isFriend?'':'blue'} shine" id="btnAddFriend" ${isFriend?'disabled':''}>${isFriend?'Já são amigos':'+ adicionar amigo'}</button>` : ''}
        </div> <p style="font-weight:600; color:var(--ink-soft);">${profile.bio}</p> ${!isOwn ? `
          <div class="divider"></div> <h4 style="color:var(--aero-deep); margin-bottom:10px;">Vote em ${viewingProfile}</h4> <div class="badge-grid"> ${BADGES.map(([k,label])=>`<button class="badge-btn ${myVoteOnThisProfile===k?'voted':''}" data-badge="${k}">${label}<small>${badgeVotes[k]||0} voto${(badgeVotes[k]||0)===1?'':'s'}</small></button>`).join('')}
          </div> ` : ''}

        ${isOwn ? `
          <div class="divider"></div> <h4 style="color:var(--aero-deep); margin-bottom:12px;">Editar minha homepage</h4> <div class="grid-2"> <div class="field"><label>Bio</label><textarea id="editBio">${profile.bio==='Ainda não escreveu nada sobre si.'?'':profile.bio}</textarea></div> <div> <div class="field"><label>Versículo favorito</label><input id="editVerse" value="${profile.verse||''}" placeholder="ex: Filipenses 4:13"></div> <div class="field"><label>Anime favorito</label><input id="editAnime" value="${profile.anime||''}" placeholder="ex: Fullmetal Alchemist"></div> </div> </div> <div class="field"><label>Avatar</label><select id="editAvatar">${AVATARS.map(a=>`<option ${a===profile.avatar?'selected':''}>${a}</option>`).join('')}</select></div> <div class="field"><label>Ou link de uma foto sua</label><input id="editAvatarUrl" value="${profile.avatarUrl||''}" placeholder="https://... (opcional, substitui o avatar)"><small>Cole o link de uma imagem já hospedada (ex: no Imgur). Sem upload de arquivo direto por aqui.</small></div> <button class="btn-glossy shine" id="btnSaveProfile">Salvar homepage</button> ` : ''}

        <div class="divider"></div> <h4 style="color:var(--aero-deep); margin-bottom:12px;">Depoimentos</h4> <div id="guestbookList">${guestbook.length? guestbook.map(g=>`<div class="recado"><div class="from">${g.from}</div><div class="text">${g.text}</div></div>`).join('') : '<p class="small-note">Ainda sem depoimentos. Seja o primeiro a deixar um!</p>'}</div> <div class="field" style="margin-top:14px;"><textarea id="newRecado" placeholder="Deixe um depoimento pra ${viewingProfile}..."></textarea></div> <button class="btn-glossy purple small shine" id="btnRecado">Enviar depoimento</button> <div class="divider"></div> <h4 style="color:var(--aero-deep); margin-bottom:12px;">Histórico de interações no fórum</h4> ${historyHtml || '<p class="small-note">Ainda sem atividade no fórum.</p>'}

        <div class="divider"></div> <h4 style="color:var(--aero-deep); margin-bottom:12px;">Membros da Aldeia</h4> <div class="member-grid">${membersHtml || '<p class="small-note">Você é o primeiro membro por aqui!</p>'}</div> <div class="divider"></div> <button class="btn-glossy blue small" id="btnLogout">Sair (trocar de usuário)</button> </div> </div>`;

  document.querySelectorAll('.member-chip').forEach(chip=>{ chip.addEventListener('click', ()=>{ viewingProfile = chip.dataset.user; renderComunidade(); }); });

  const btnAdd = document.getElementById('btnAddFriend');
  if(btnAdd){
    btnAdd.addEventListener('click', async ()=>{
      const mp = await getShared('member:'+currentUser);
      mp.friends = mp.friends || [];
      if(!mp.friends.includes(viewingProfile)){ mp.friends.push(viewingProfile); await setShared('member:'+currentUser, mp); }
      renderComunidade();
    });
  }

  document.querySelectorAll('.badge-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!requireLogin()) return;
      const votes = await getPersonalJSON('mybadgevotes', {});
      const badges = (await getShared('badges:'+viewingProfile)) || {};
      const chosen = btn.dataset.badge;
      const prev = votes[viewingProfile];
      if(prev===chosen){
        badges[chosen] = Math.max(0,(badges[chosen]||0)-1);
        delete votes[viewingProfile];
      } else {
        if(prev) badges[prev] = Math.max(0,(badges[prev]||0)-1);
        badges[chosen] = (badges[chosen]||0)+1;
        votes[viewingProfile] = chosen;
      }
      await setShared('badges:'+viewingProfile, badges);
      await setPersonalJSON('mybadgevotes', votes);
      renderComunidade();
    });
  });

  const btnSave = document.getElementById('btnSaveProfile');
  if(btnSave){
    btnSave.addEventListener('click', async ()=>{
      const p = await getShared('member:'+currentUser);
      p.bio = document.getElementById('editBio').value.trim() || 'Ainda não escreveu nada sobre si.';
      p.verse = document.getElementById('editVerse').value.trim();
      p.anime = document.getElementById('editAnime').value.trim();
      p.avatar = document.getElementById('editAvatar').value;
      p.avatarUrl = document.getElementById('editAvatarUrl').value.trim();
      await setShared('member:'+currentUser, p);
      renderComunidade();
    });
  }

  document.getElementById('btnRecado').addEventListener('click', async ()=>{
    const text = document.getElementById('newRecado').value.trim();
    if(!text) return;
    if(!requireLogin()) return;
    const gb = (await getShared('guestbook:'+viewingProfile)) || [];
    gb.unshift({from:currentUser, text});
    await setShared('guestbook:'+viewingProfile, gb);
    renderComunidade();
  });

  document.getElementById('btnLogout').addEventListener('click', async ()=>{
    await setPersonal('currentUser', '');
    currentUser = null; viewingProfile = null;
    renderComunidade();
  });
}

render();

/* ============ Chat lateral (amigos + grupo) ============ */
(function(){
  const toggle = document.getElementById('chatToggle');
  const panel = document.getElementById('chatPanel');
  const area = document.getElementById('chatArea');
  const ctabAmigos = document.getElementById('ctabAmigos');
  const ctabGrupo = document.getElementById('ctabGrupo');

  toggle.addEventListener('click', ()=>{
    panel.classList.toggle('open');
    if(panel.classList.contains('open')) drawChat();
    else if(chatPollTimer){ clearInterval(chatPollTimer); chatPollTimer=null; }
  });
  ctabAmigos.addEventListener('click', ()=>{ chatMode='amigos'; chatActiveFriend=null; ctabAmigos.classList.add('active'); ctabGrupo.classList.remove('active'); drawChat(); });
  ctabGrupo.addEventListener('click', ()=>{ chatMode='grupo'; ctabGrupo.classList.add('active'); ctabAmigos.classList.remove('active'); drawChat(); });

  function pairKey(a,b){ return [a,b].sort().join('__'); }

  async function drawChat(){
    if(!currentUser){
      area.innerHTML = '<div style="padding:16px;"><p class="small-note">Entre na Comunidade pra poder conversar com a galera.</p></div>';
      return;
    }
    if(chatMode==='amigos' && !chatActiveFriend){
      const myProfile = await getShared('member:'+currentUser);
      const friends = (myProfile && myProfile.friends) || [];
      area.innerHTML = `<div class="chat-list" id="friendList">${friends.length? friends.map(f=>`<div class="chat-friend" data-f="${f}"><div class="avatar-sm"></div><div class="mname">${f}</div></div>`).join('') : '<p class="small-note" style="padding:10px;">Você ainda não adicionou amigos. Visite perfis na Comunidade!</p>'}</div>`;
      area.querySelectorAll('.chat-friend').forEach(el=>{ el.addEventListener('click', ()=>{ chatActiveFriend = el.dataset.f; drawChat(); }); });
      return;
    }
    let key, title;
    if(chatMode==='grupo'){ key = 'chat-group'; title='Grupo geral'; }
    else { key = 'dm:'+pairKey(currentUser, chatActiveFriend); title = chatActiveFriend; }

    const msgs = (await getShared(key)) || [];
    area.innerHTML = `
      ${chatMode==='amigos' ? `<button class="chat-back" id="chatBack">← ${title}</button>` : ''}
      <div class="chat-thread" id="chatThread">${msgs.map(m=>`<div class="chat-msg ${m.author===currentUser?'mine':''}"><span class="who">${m.author}</span>${m.text}</div>`).join('') || '<p class="small-note" style="padding:10px;">Nenhuma mensagem ainda — diga oi!</p>'}</div> <div class="chat-input-row"><input type="text" id="chatInput" placeholder="Escreva uma mensagem..."><button id="chatSend">Enviar</button></div> `;
    const thread = document.getElementById('chatThread');
    thread.scrollTop = thread.scrollHeight;
    const back = document.getElementById('chatBack');
    if(back) back.addEventListener('click', ()=>{ chatActiveFriend=null; drawChat(); });
    document.getElementById('chatSend').addEventListener('click', ()=>sendMsg(key));
    document.getElementById('chatInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMsg(key); });

    if(chatPollTimer) clearInterval(chatPollTimer);
    chatPollTimer = setInterval(async ()=>{
      const fresh = (await getShared(key)) || [];
      const t = document.getElementById('chatThread');
      if(!t) return;
      t.innerHTML = fresh.map(m=>`<div class="chat-msg ${m.author===currentUser?'mine':''}"><span class="who">${m.author}</span>${m.text}</div>`).join('') || '<p class="small-note" style="padding:10px;">Nenhuma mensagem ainda — diga oi!</p>';
    }, 6000);
  }

  async function sendMsg(key){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;
    const msgs = (await getShared(key)) || [];
    msgs.push({author:currentUser, text, ts:Date.now()});
    await setShared(key, msgs);
    input.value='';
    drawChat();
  }

  window.__redrawChat = drawChat;
})();

/* ============ Rádio (skin Windows Media Player) ============ */
(function(){
  const RADIO_NAME = 'Rádio Aldeia';

  // Link direto da Rádio Aldeia na Zeno FM.
  const STREAM_URLS = [
    'https://stream.zeno.fm/jpqkapo4xffvv'
  ];

  const audio = document.getElementById('wmpAudio');
  const playerEl = document.getElementById('wmpPlayer');
  const btnPlay = document.getElementById('wmpPlay');
  const btnPrev = document.getElementById('wmpPrev');
  const btnNext = document.getElementById('wmpNext');
  const btnMin = document.getElementById('wmpMin');
  const titlebar = document.getElementById('wmpTitlebar');
  const volumeSlider = document.getElementById('wmpVolume');
  const btnMute = document.getElementById('wmpMute');
  const statusEl = document.getElementById('wmpStatus');
  const clockEl = document.getElementById('wmpClock');
  const trackEl = document.getElementById('wmpTrack');
  const progressFill = document.getElementById('wmpProgressFill');
  const stationSelect = document.getElementById('wmpStations');

  let seconds = 0;
  let clockTimer = null;
  let muted = false;
  let streamIndex = 0;
  let userStopped = true;
  let retrying = false;

  stationSelect.innerHTML = '<option value="0">' + RADIO_NAME + '</option>';
  stationSelect.disabled = true;
  trackEl.textContent = 'Aldeia dos Crentes — ' + RADIO_NAME;

  // Ajuda o navegador a tratar o elemento como áudio ao vivo.
  audio.preload = 'none';
  audio.volume = 0.7;

  function fmt(n){
    return String(n).padStart(2,'0');
  }

  function tickClock(){
    seconds++;
    const h = Math.floor(seconds/3600);
    const m = Math.floor((seconds%3600)/60);
    const s = seconds%60;
    clockEl.textContent = fmt(h)+':'+fmt(m)+':'+fmt(s);

    // Rádio ao vivo não possui duração/progresso real.
    progressFill.style.width = (15 + (seconds % 70)) + '%';
  }

  function setPlaying(isPlaying){
    if(isPlaying){
      btnPlay.textContent = 'II';
      statusEl.textContent = 'TOCANDO AGORA';
      if(!clockTimer) clockTimer = setInterval(tickClock, 1000);
    } else {
      btnPlay.textContent = '▶';
      if(clockTimer){
        clearInterval(clockTimer);
        clockTimer = null;
      }
    }
  }

  function setStream(index){
    streamIndex = index % STREAM_URLS.length;
    audio.src = STREAM_URLS[streamIndex];
  }

  async function connectRadio(){
    userStopped = false;
    retrying = false;
    statusEl.textContent = 'CONECTANDO...';

    try {
      // Para stream ao vivo, criar uma conexão nova evita voltar
      // para um buffer antigo depois de pausar.
      audio.pause();
      setStream(streamIndex);
      audio.load();

      const playPromise = audio.play();
      if(playPromise !== undefined) await playPromise;
    } catch(err) {
      console.error('Erro ao iniciar a Rádio Aldeia:', err);

      if(streamIndex < STREAM_URLS.length - 1){
        streamIndex++;
        statusEl.textContent = 'TENTANDO OUTRA CONEXÃO...';
        try {
          setStream(streamIndex);
          audio.load();
          const retryPromise = audio.play();
          if(retryPromise !== undefined) await retryPromise;
        } catch(secondErr) {
          console.error('Falha também na URL alternativa:', secondErr);
          statusEl.textContent = 'NÃO FOI POSSÍVEL CONECTAR';
          setPlaying(false);
        }
      } else {
        statusEl.textContent = 'NÃO FOI POSSÍVEL CONECTAR';
        setPlaying(false);
      }
    }
  }

  function stopRadio(){
    userStopped = true;
    audio.pause();

    // Remove a conexão atual. No próximo Play, abre o ao vivo novamente.
    audio.removeAttribute('src');
    audio.load();

    statusEl.textContent = 'PAUSADO';
    setPlaying(false);
  }

  btnPlay.addEventListener('click', async ()=>{
    if(!audio.paused && audio.src){
      stopRadio();
      return;
    }

    // Sempre reconecta usando o link direto da rádio.
    streamIndex = 0;
    await connectRadio();
  });

  // Há apenas uma rádio. Mantemos os botões do visual do Media Player:
  btnPrev.addEventListener('click', async ()=>{
    if(!userStopped){
      streamIndex = 0;
      await connectRadio();
    }
  });

  btnNext.addEventListener('click', async ()=>{
    if(!userStopped){
      streamIndex = 0;
      await connectRadio();
    }
  });

  audio.addEventListener('loadstart', ()=>{
    if(!userStopped) statusEl.textContent = 'CONECTANDO...';
  });

  audio.addEventListener('waiting', ()=>{
    if(!userStopped) statusEl.textContent = 'CARREGANDO...';
  });

  audio.addEventListener('stalled', ()=>{
    if(!userStopped) statusEl.textContent = 'RECONECTANDO...';
  });

  audio.addEventListener('canplay', ()=>{
    if(!userStopped) statusEl.textContent = 'PRONTO';
  });

  audio.addEventListener('playing', ()=>{
    retrying = false;
    setPlaying(true);
  });

  audio.addEventListener('pause', ()=>{
    if(userStopped) setPlaying(false);
  });

  audio.addEventListener('error', async ()=>{
    if(userStopped || retrying) return;

    const mediaError = audio.error;
    console.error('Erro do elemento de áudio:', mediaError);

    // Se houver erro, informa indisponibilidade sem trocar o endereço da rádio.
    if(streamIndex < STREAM_URLS.length - 1){
      retrying = true;
      streamIndex++;
      statusEl.textContent = 'TENTANDO OUTRA CONEXÃO...';

      try {
        setStream(streamIndex);
        audio.load();
        const p = audio.play();
        if(p !== undefined) await p;
      } catch(err) {
        console.error('Erro na reconexão:', err);
        statusEl.textContent = 'ESTAÇÃO INDISPONÍVEL';
        setPlaying(false);
      } finally {
        retrying = false;
      }
    } else {
      statusEl.textContent = 'ESTAÇÃO INDISPONÍVEL';
      setPlaying(false);
    }
  });

  volumeSlider.addEventListener('input', ()=>{
    audio.volume = volumeSlider.value / 100;

    if(audio.volume > 0 && muted){
      muted = false;
      audio.muted = false;
      btnMute.textContent = 'Vol';
    }
  });

  btnMute.addEventListener('click', ()=>{
    muted = !muted;
    audio.muted = muted;
    btnMute.textContent = muted ? 'Mudo' : 'Vol';
  });

  btnMin.addEventListener('click', (e)=>{
    e.stopPropagation();
    playerEl.classList.toggle('collapsed');
    btnMin.textContent = playerEl.classList.contains('collapsed') ? '+' : '–';
  });

  titlebar.addEventListener('click', (e)=>{
    if(e.target === btnMin) return;
    playerEl.classList.toggle('collapsed');
    btnMin.textContent = playerEl.classList.contains('collapsed') ? '+' : '–';
  });

  statusEl.textContent = 'PARADO';
})();
</script>
</body>
</html>
